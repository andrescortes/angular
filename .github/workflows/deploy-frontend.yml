name: Deploy Angular IPTV Frontend (Monorepo)

on:
  push:
    branches: ["main"]
    paths:
      - "iptv-app-fr/**"
      - ".github/workflows/deploy-frontend.yml"

# Cancela ejecuciones anteriores si haces varios push seguidos a main
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: iptv-app-fr/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: iptv-app-fr
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: iptv-app-fr
        run: pnpm test --watch=false

      - name: Build app
        working-directory: iptv-app-fr
        run: pnpm build

      - name: Conectar a la red privada Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configurar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Desplegar directamente en la ruta de Nginx
        run: |
          rsync -avz --delete \
            -e "ssh -p 8022 -o StrictHostKeyChecking=no" \
            iptv-app-fr/dist/iptv-app-fr/browser/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_TAILSCALE_IP }}:/data/data/com.termux/files/usr/share/nginx/html/

      - name: Recargar servidor Nginx
        run: |
          ssh -p 8022 -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_TAILSCALE_IP }} \
            "nginx -t && (nginx -s reload 2>/dev/null || nginx)"
