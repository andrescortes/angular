<div class="h-screen flex flex-col bg-slate-950 text-slate-100">
  <app-header></app-header>

  <div class="flex flex-1 overflow-hidden">
    <aside class="w-72 border-r border-slate-800/80 overflow-y-auto
             bg-slate-950/95 backdrop-blur flex flex-col">
      <!-- Feature Navigation -->
      <div class="p-3 flex flex-col gap-2 font-semibold tracking-wide
               bg-slate-950/95 text-slate-300 border-b border-slate-800/80 sticky top-0 z-10 backdrop-blur">
        <button
          type="button"
          (click)="setView('channels')"
          [class.bg-cyan-600]="activeView() === 'channels'"
          [class.text-white]="activeView() === 'channels'"
          [class.bg-slate-900]="activeView() !== 'channels'"
          class="w-full py-2 px-3 rounded-lg text-sm text-left flex items-center justify-between border border-slate-800 hover:border-slate-700 transition cursor-pointer">
          <span class="flex items-center gap-2"><span>📺</span> IPTV Channels</span>
        </button>

        <button
          type="button"
          (click)="setView('bookmarks')"
          [class.bg-cyan-600]="activeView() === 'bookmarks'"
          [class.text-white]="activeView() === 'bookmarks'"
          [class.bg-slate-900]="activeView() !== 'bookmarks'"
          class="w-full py-2 px-3 rounded-lg text-sm text-left flex items-center justify-between border border-slate-800 hover:border-slate-700 transition cursor-pointer">
          <span class="flex items-center gap-2"><span>🔖</span> Bookmarks Lab</span>
          <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-cyan-400/20 text-cyan-300 border border-cyan-400/30">CRUD</span>
        </button>

        <button
          type="button"
          (click)="setView('chat')"
          [class.bg-cyan-600]="activeView() === 'chat'"
          [class.text-white]="activeView() === 'chat'"
          [class.bg-slate-900]="activeView() !== 'chat'"
          class="w-full py-2 px-3 rounded-lg text-sm text-left flex items-center justify-between border border-slate-800 hover:border-slate-700 transition cursor-pointer">
          <span class="flex items-center gap-2"><span>💬</span> Live Chat</span>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto">
        <app-countries-sidebar />
      </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 overflow-y-auto p-5">
      @switch (activeView()) {
        @case ('bookmarks') {
          <app-bookmark-manager />
        }
        @case ('chat') {
          <app-chat />
        }
        @default {
          <app-channels-grid />
        }
      }
    </main>
  </div>
</div>
